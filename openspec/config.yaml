schema: spec-driven

context: |
  Language: English. All artifacts must be written in English (the repository is public).
  Project: gobluetti, a Go library (github.com/Niord/gobluetti) that controls BLUETTI power
  stations through the BLUETTI cloud. A separate nested module (github.com/Niord/gobluetti/ble)
  supports legacy stations over plaintext Modbus on BLE; encrypted BLE models are out of scope;
  see README.md ("Bluetooth (legacy stations)").

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
